name: Data probe

on:
  workflow_dispatch:
  push:
    branches: [claude/backtester-scanner-ver3h2]
    paths: [scripts/**, .github/workflows/data-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/dolthub_probe.py
