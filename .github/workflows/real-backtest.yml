name: Real-data backtest

# Backtests the playbook on DoltHub's free daily option chains, with Cboe's
# VIX, VIX3M and PutWrite (PUT) index histories. Results are in the run
# summary and the "backtest" artifact.
on:
  workflow_dispatch:
    inputs:
      start:
        description: First day of data to fetch (the backtest starts a year later)
        default: "2019-01-01"
      end:
        description: Last day
        default: "2026-09-30"
  push:
    branches: [claude/backtester-scanner-ver3h2]
    paths: [scripts/fetch_dolthub.py, .github/workflows/real-backtest.yml, "config/**", "optlab/**"]

concurrency:
  group: real-backtest
  cancel-in-progress: true

env:
  START: ${{ inputs.start || '2019-01-01' }}
  END: ${{ inputs.end || '2026-09-30' }}
  SYMBOLS: SPY T PFE INTC KMI F SOFI HPE WBD KHC VZ BAC EWZ FXI SLV GDX XLF

jobs:
  # One job per year, run in parallel and cached per year, so no single job
  # runs into GitHub's time limit and a re-run only fetches what is missing.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Date range
        id: range
        run: |
          s="${{ matrix.year }}-01-01"; e="${{ matrix.year }}-12-31"
          [[ "$START" > "$s" ]] && s="$START"
          [[ "$END" < "$e" ]] && e="$END"
          echo "start=$s" >> "$GITHUB_OUTPUT"; echo "end=$e" >> "$GITHUB_OUTPUT"
      - name: Restore chains
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/chains_${{ matrix.year }}.csv.gz
          key: dolthub-v3-${{ steps.range.outputs.start }}-${{ steps.range.outputs.end }}-${{ env.SYMBOLS }}
      - name: Fetch chains from DoltHub
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          python scripts/fetch_dolthub.py --start "${{ steps.range.outputs.start }}" \
            --end "${{ steps.range.outputs.end }}" --symbols $SYMBOLS --out data/chains_${{ matrix.year }}.csv.gz
      - name: Save chains
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/chains_${{ matrix.year }}.csv.gz
          key: dolthub-v3-${{ steps.range.outputs.start }}-${{ steps.range.outputs.end }}-${{ env.SYMBOLS }}
      - uses: actions/upload-artifact@v4
        with:
          name: chains-${{ matrix.year }}
          path: data/chains_${{ matrix.year }}.csv.gz
          if-no-files-found: ignore
          retention-days: 7

  backtest:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: chains-*
          path: data
          merge-multiple: true
      - name: Combine years
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          parts = [pd.read_csv(p) for p in sorted(glob.glob("data/chains_*.csv.gz"))]
          df = pd.concat([p for p in parts if not p.empty], ignore_index=True)
          df.to_csv("data/dolthub_chains.csv.gz", index=False)
          g = df.groupby("underlying_symbol").quote_date.agg(["min", "max", "nunique"])
          print(g.to_string())
          with open("data/coverage.txt", "w") as f:
              f.write(g.to_string() + "\n")
          PY

      - name: Fetch Cboe indices
        run: |
          for n in VIX VIX3M PUT; do
            curl -fsSL "https://cdn.cboe.com/api/global/us_indices/daily_prices/${n}_History.csv" -o "data/${n}_History.csv"
          done

      - name: Backtest
        shell: bash
        run: |
          mkdir -p out
          bt_start=$(python -c "import pandas as pd;print((pd.Timestamp('$START')+pd.DateOffset(years=1)).date())")
          optlab backtest --source csv --chains data/dolthub_chains.csv.gz \
            --vix data/VIX_History.csv --vix3m data/VIX3M_History.csv --put-index data/PUT_History.csv \
            --config config/default.toml config/dolthub.toml \
            --start "$bt_start" --end "$END" --out out | tee out/summary.txt
          python - <<'PY' | tee out/breakdown.txt
          import pandas as pd
          def read(path):
              try:
                  return pd.read_csv(path)
              except pd.errors.EmptyDataError:
                  return pd.DataFrame()
          t = read("out/trades.csv")
          if t.empty:
              print("No trades.")
          else:
              g = t.groupby(["sleeve", "structure"]).pnl.agg(["count", "sum", "mean"]).round(2)
              print(g.to_string())
              print()
              print(t.exit_reason.value_counts().to_string())
          s = read("out/skips.csv")
          if not s.empty:
              s["why"] = s.sleeve + ": " + s.reason.str.replace(r"[0-9$.,]+", "#", regex=True)
              print()
              print(s.why.value_counts().head(15).to_string())
          e = pd.read_csv("out/equity.csv", index_col="date", parse_dates=True)
          yearly = e.resample("YE").last().pct_change()
          yearly.iloc[0] = e.resample("YE").last().iloc[0] / e.iloc[0] - 1
          print()
          print("Return by year")
          print((100 * yearly).round(1).rename(index=lambda d: d.year).to_string())
          if not t.empty:
              print()
              cols = ["symbol", "sleeve", "structure", "entry_date", "exit_date", "contracts", "strikes", "entry_price", "pnl", "exit_reason"]
              print(t[cols].to_string(index=False))
          PY
          {
            echo '```'
            echo "Data coverage (first day, last day, days):"
            cat data/coverage.txt
            echo
            cat out/summary.txt out/breakdown.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: out/
