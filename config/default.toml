# Settings for a $5,000 cash account. Every key is optional; anything left out
# uses the default in optlab/config.py, which follows the strategy playbook.
# Copy this file, edit it, and pass it with --config.

[account]
starting_capital = 5000
account_type = "cash"
# Cash account, no margin (KH, 2026-10-04): no spreads. Short premium is
# cash-secured puts on low-priced names (see [risk] and [universe]).
spreads_allowed = false
commission_per_contract = 0.65

[universe]
index = ["SPY"]
# Liquid names cheap enough that one cash-secured put ties up at most half the
# account. The scanner skips any whose price has moved out of range.
stocks = ["T", "PFE", "INTC", "KMI", "F", "SOFI", "HPE", "WBD", "KHC", "VZ", "BAC", "EWZ", "FXI", "SLV", "GDX", "XLF"]
min_price = 10

[entry]
short_dte_min = 30
short_dte_max = 45
put_spread_delta = 0.30
condor_delta = 0.16
wing_width = 1.0
min_credit_to_width_spread = 0.33
min_credit_to_width_condor = 0.25
ivr_sell_min = 30
ivr_buy_max = 25

[exits]
short_profit_target = 0.50
short_stop_multiple = 2.0
short_exit_dte = 21

[risk]
per_trade_max_loss_pct = 0.02
portfolio_max_loss_pct = 0.25
stress_max_loss_pct = 0.15
# A cash-secured put's max loss is owning the stock, which never fits the 2%
# cap. Size each one by its stress-test loss instead, at most 2 open.
csp_risk_basis = "stress"
csp_stress_max_pct = 0.05
csp_max_collateral_pct = 0.50
csp_max_positions = 2

[hedge]
enabled = true
premium_share = 0.10
delta = 0.05
symbol = "SPY"
